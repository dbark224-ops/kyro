name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

# Note: `npm run build` is deliberately not run here.
# Vercel already builds every push, and next.config.ts does not set
# typescript.ignoreBuildErrors, so the production build is genuinely gated there.
# Building here as well would need the full production env var set in GitHub
# secrets for no extra safety. What Vercel does NOT do is run the test suite --
# that gap is what this workflow closes.
